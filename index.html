<html lang="ja">
<head>
    <title>抽選App</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="抽選App">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">
    </head>
<body>

<div class="switching">
  <div class="switching__content-box">
    <!-- 確率で切り替え有りのエリア -->
    <div class="switching__content js-randomSwitching">
      <div class="switching__content-inner">
        <!-- 初期表示でhazure.pngを中央揃えで表示 -->
        <img id="result-image" src="hazure.png" alt="ハズレ"/>
      </div>
    </div>
    <div class="switching__content">
      <div class="switching__content-inner">
        <!-- クリックカウンタ用の要素 -->
        <div id="click-counter">
          <p>現在の回転数：<span id="count">0</span>回転</p>
          <!-- 画像ボタンに変更 -->
          <img id="click-button" src="button.png" alt="クリックしてカウント" style="cursor: pointer;"/>
        </div>
      </div><!-- /.switching__contentBox -->
    </div><!-- /.switching -->
  </div><!-- /.switching__content-box -->
</div><!-- /.switching -->

<!-- CSS -->
<style>
/*--------------------
 switching
--------------------*/
html, body {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
  background-color: #f5f5f5;
}

.switching__content-box {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.switching__content {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
  box-sizing: border-box;
}

.switching__content:nth-child(odd) {
  background-color: rgba(32, 47, 85, 0.1);
}

.switching__content-inner {
  width: 100%;
  max-width: 500px; /* 最大幅を設定して中央に */
  display: flex;
  flex-direction: column;
  align-items: center;
}

.switching__content-text {
  font-size: 24px;
  text-align: center;
}

/* クリックカウンタ */
#click-counter {
  text-align: center;
  margin-top: 20px;
  font-size: 18px;
}

#click-button {
  width: 60%;
  max-width: 250px;
  height: auto;
  margin-top: 15px;
  cursor: pointer;
}

/* 結果画像調整 */
#result-image {
  width: 100%;
  height: auto;
  max-height: 60vh; /* 最大高さを指定 */
  object-fit: contain; /* 縦横比を保って収める */
}

/* 動画のスタイル調整 */
video {
  width: 100%;
  height: auto;
  max-width: 100%;
  max-height: 60vh; /* 最大高さを指定 */
  object-fit: contain; /* 縦横比を保つ */
}
</style>

<script>
    // Service Workerの登録処理はそのまま残します
    if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service_worker.js').then(function(registration) {
        console.log('ServiceWorker registration successful with scope: ', registration.scope);
    }).catch(function(err) {
        console.log('ServiceWorker registration failed: ', err);
    });
    }
  
//random switching
(function (){
  let i = 0;
  let el = {};
  document.addEventListener('DOMContentLoaded', function () {
    el.randomSwitching = document.querySelectorAll('.js-randomSwitching');
    el.random = Math.floor(Math.random() * 100);  // 0 ～ 99のランダム値
    const clickButton = document.getElementById('click-button');
    
    // 常に初期値 0 と false で開始
    let count = 0; 
    const countDisplay = document.getElementById('count');
    let isWinner = false; 
    
    const resultImage = document.getElementById('result-image'); // 画像要素を取得

    // 初期表示
    countDisplay.innerText = count;

    // 当選状態の確認と適用 (初期のランダム判定は残します)
    if (isWinner || el.random < 6) { 
      randomSwitchFnc();
    }

    // 画像ボタンにクリックイベントを追加
    clickButton.addEventListener('click', function () { 
      if (!isWinner) {
        count++;
        countDisplay.innerText = count;
        // localStorageの保存処理は削除済み

        el.random = Math.floor(Math.random() * 16);  // 0 ～ 15のランダム値
        if (el.random === 0) {  // 1/16 の確率 (0の場合)
          isWinner = true;
          // localStorageの保存処理は削除済み
          randomSwitchFnc();
        }
      }
    });

    function randomSwitchFnc() {
      // (中略：当選時の処理)
      resultImage.style.display = 'none';

      const videoElement = document.createElement('video');
      videoElement.src = 'atari.mp4'; 
      videoElement.controls = true; 
      // (中略：スタイル調整)
      videoElement.style.width = '100%';
      videoElement.style.height = 'auto'; 
      videoElement.style.maxWidth = '100%';  
      videoElement.style.maxHeight = '60vh'; 
      videoElement.style.objectFit = 'contain'; 
      
      el.randomSwitching[0].appendChild(videoElement); 

      videoElement.play();

      clickButton.disabled = true;
      clickButton.style.cursor = 'not-allowed'; 
      clickButton.style.pointerEvents = 'none';

      clickButton.setAttribute('alt', '当選おめでとう！'); 
    }
  }, false);
})();
</script>

</body>
</html>
